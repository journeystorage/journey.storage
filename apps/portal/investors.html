<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey.storage — Investors</title>
<style>
:root{
  --bg:#211e1a; --bg2:#1a1815; --panel:#262220; --panel2:#2b2724;
  --border:#3a342e; --border2:#494138;
  --ink:#efe9df; --ink2:#b8afa3; --ink3:#847b6f;
  --accent:#e05a26; --accent2:#f07a45;
  --green:#57a86d; --amber:#d8a03d; --red:#c95a4d;
  --cream:#f4eee1; --cream-ink:#2b2724;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
.serif{font-family:Georgia,'Times New Roman',serif}

/* watermark */
.watermark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden}
.watermark span{font-family:Georgia,serif;font-weight:700;font-size:38vw;letter-spacing:1vw;color:rgba(255,255,255,0.022);white-space:nowrap;user-select:none}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:28px;background:#161412;border-bottom:1px solid #000;padding:0 28px;height:52px}
.wordmark{font-weight:800;letter-spacing:.5px;font-size:15px;color:#fff;white-space:nowrap}
.wordmark b{color:#fff}.wordmark span{color:#9c9287;font-weight:600}
.wordmark::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:7px;border-radius:1px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:none;color:var(--ink2);font:600 13px/1 inherit;font-family:inherit;padding:19px 12px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button.on{color:#fff;border-bottom-color:var(--accent)}
.top-right{display:flex;align-items:center;gap:14px;color:var(--ink3);font-size:12.5px}
.btn{background:var(--accent);border:none;color:#fff;font:700 12.5px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--ink2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink3)}
.btn.small{padding:7px 12px;font-size:11.5px}
.btn.tiny{padding:5px 9px;font-size:10.5px}

/* page frame */
.page{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:34px 28px 80px}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:14px}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer}
.kicker{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
h1.pagetitle{font-family:Georgia,serif;font-weight:400;font-size:34px;color:#fff;margin-bottom:6px}
h1.pagetitle b{font-weight:700}
.pagesub{color:var(--ink2);font-size:13.5px;max-width:640px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.tile .v{font-family:Georgia,serif;font-size:26px;font-weight:700;color:#fff}
.tile .l{font-size:12px;color:var(--ink2);margin-top:2px}
.tile .s{font-size:11px;margin-top:4px;color:var(--ink3)}
.tile .s.good{color:var(--green)}.tile .s.warn{color:var(--accent2)}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--border2)}

/* meter */
.meter{height:6px;background:#3a342e;border-radius:3px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--green);border-radius:3px}
.meter i.orange{background:var(--accent)}

/* panels & tables */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-h h3{font-size:13px;font-weight:700;color:var(--ink)}
.panel-h .sub{font-size:11.5px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--ink2)}
td{padding:10px 14px;border-bottom:1px solid #2e2a25;color:var(--ink2);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#2b2723}
td .nm{color:var(--ink);font-weight:600}
td .grp{font-size:11.5px;color:var(--ink3)}
.right{text-align:right}
.amount{font-family:Georgia,serif;font-weight:700;color:#fff;white-space:nowrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip.funded{background:rgba(87,168,109,.16);color:#7cc492;border-color:rgba(87,168,109,.35)}
.chip.committed{background:rgba(224,90,38,.15);color:#f0925f;border-color:rgba(224,90,38,.4)}
.chip.engaged{background:rgba(216,160,61,.13);color:#dfb469;border-color:rgba(216,160,61,.35)}
.chip.lead{background:rgba(244,238,225,.1);color:#ddd5c7;border-color:rgba(244,238,225,.25)}
.chip.backup{background:rgba(160,148,132,.12);color:#b0a696;border-color:rgba(160,148,132,.3)}
.chip.finder{background:rgba(140,160,200,.12);color:#a8bad8;border-color:rgba(140,160,200,.3)}
.chip.finder_inactive,.chip.needs_contact,.chip.gatekept,.chip.connector{background:rgba(132,123,111,.12);color:#9d9488;border-color:rgba(132,123,111,.3)}
.chip.out{background:rgba(201,90,77,.1);color:#c98a80;border-color:rgba(201,90,77,.28)}
.chip.deal{background:#33302b;color:var(--ink2);border-color:var(--border2)}
.chip.tog{cursor:pointer;background:#33302b;color:var(--ink3);border-color:var(--border2)}
.chip.tog.on{background:rgba(87,168,109,.16);color:#7cc492;border-color:rgba(87,168,109,.35)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--border2);border-radius:999px;color:var(--ink);padding:9px 16px 9px 36px;font:inherit;font-size:13px;outline:none}
.search input:focus{border-color:var(--accent)}
.search::before{content:"⌕";position:absolute;left:14px;top:7px;color:var(--ink3);font-size:16px}
select{background:var(--panel);border:1px solid var(--border2);border-radius:999px;color:var(--ink2);padding:8px 12px;font:inherit;font-size:12.5px;outline:none;cursor:pointer}
input[type=date],input[type=text],input[type=number],textarea{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--ink);padding:8px 10px;font:inherit;font-size:13px;outline:none;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:12px 0 5px}

/* follow-up cards */
.fu-group{margin-bottom:26px}
.fu-title{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;color:var(--ink3)}
.fu-title.overdue{color:var(--red)}.fu-title.today{color:var(--accent)}
.fu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.fu-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fu-card:hover{border-color:var(--border2)}
.fu-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fu-card .nm{font-weight:700;color:#fff;cursor:pointer}
.fu-card .nm:hover{color:var(--accent2)}
.fu-card .grp{font-size:11.5px;color:var(--ink3)}
.fu-card .note{font-size:12px;color:var(--ink2);font-style:italic;max-height:54px;overflow:hidden}
.fu-card .meta{font-size:11px;color:var(--ink3)}
.fu-card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.due{font-size:11px;font-weight:700;white-space:nowrap}
.due.overdue{color:var(--red)}.due.today{color:var(--accent2)}.due.soon{color:var(--amber)}.due.later{color:var(--ink3)}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{min-width:250px;width:250px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;flex-shrink:0}
.col-h{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.col-h .t{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.col-h .n{font-size:11px;color:var(--ink3)}
.col-cards{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:560px;overflow-y:auto}
.mini{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer}
.mini:hover{border-color:var(--border2)}
.mini .nm{font-weight:600;color:var(--ink);font-size:12.5px}
.mini .grp{font-size:11px;color:var(--ink3)}
.mini .amt{font-family:Georgia,serif;font-weight:700;color:#fff;font-size:13px;margin-top:3px}
.mini .fu{font-size:10.5px;color:var(--ink3);margin-top:3px}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:90;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:-560px;width:560px;max-width:96vw;height:100%;background:var(--bg2);border-left:1px solid var(--border2);z-index:100;transition:right .22s ease;overflow-y:auto}
.drawer.open{right:0}
.drawer-in{padding:26px 28px 60px}
.drawer h2{font-family:Georgia,serif;font-size:24px;color:#fff;font-weight:700}
.drawer .close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--ink3);font-size:22px;cursor:pointer}
.drawer .close:hover{color:#fff}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px;margin:14px 0}
.kv .k{color:var(--ink3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding-top:3px}
.dealbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:14px}
.dealbox .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dealbox .dh .t{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.muted{color:var(--ink3);font-size:12px}
.notesbox{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink2);margin-top:8px;white-space:pre-wrap}

/* modal */
.modal{position:fixed;inset:0;z-index:110;display:none;align-items:flex-start;justify-content:center;padding:60px 20px;background:rgba(10,8,6,.6)}
.modal.open{display:flex}
.modal-in{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;width:520px;max-width:100%;padding:26px 28px;max-height:85vh;overflow-y:auto}
.modal-in h2{font-family:Georgia,serif;font-size:22px;color:#fff;margin-bottom:4px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f4eee1;color:#2b2724;font-weight:600;font-size:13px;padding:11px 20px;border-radius:999px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1}

/* prospects subtabs */
.subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{background:var(--panel);border:1px solid var(--border2);border-radius:999px;color:var(--ink2);padding:8px 16px;font:600 12.5px/1 inherit;font-family:inherit;cursor:pointer}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.footer-note{margin-top:34px;text-align:center;font-size:11.5px;color:var(--ink3)}
.empty{padding:30px;text-align:center;color:var(--ink3);font-size:13px}
.leader-rank{font-family:Georgia,serif;font-weight:700;color:var(--ink3);width:30px}
@media(max-width:720px){.kv{grid-template-columns:100px 1fr}.grid2{grid-template-columns:1fr}}

/* ---- portal auth gate ---- */
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1100px 620px at 50% -10%,#2a2621 0%,var(--bg) 62%)}
body.authed #gate{display:none}
body:not(.authed) .topbar,body:not(.authed) #page{display:none}
.gatecard{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:38px 34px}
.gatelogo{font-weight:800;letter-spacing:.5px;color:#fff;margin-bottom:22px}
.gatelogo::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:7px;border-radius:1px}
.gatelogo span{color:#9c9287}
.gatecard h1{font-family:Georgia,serif;font-weight:600;font-size:26px;color:#fff;margin-bottom:6px}
.gatesub{color:var(--ink2);font-size:13px;margin-bottom:20px;line-height:1.5}
.gatecard label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px}
.gatecard input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:9px;color:var(--ink);font:14px/1.4 inherit;padding:11px 13px}
.gatecard input:focus{outline:none;border-color:var(--accent)}
.gatemsg{min-height:18px;margin-top:14px;font-size:12.5px;color:var(--accent2);text-align:center;line-height:1.4}
</style>
</head>
<body>
<div class="watermark"><span>RAISE</span></div>

<div id="gate">
  <form id="gateForm" class="gatecard" autocomplete="on">
    <div class="gatelogo">JOURNEY<span>.STORAGE</span></div>
    <h1>Investors</h1>
    <p class="gatesub">Private workspace. Restricted to Lyvia &amp; Jonah. Sign in with your Journey.storage credentials.</p>
    <label for="gateEmail">Email</label>
    <input id="gateEmail" type="email" autocomplete="email" placeholder="you@journey.storage" required>
    <label for="gatePass">Password</label>
    <input id="gatePass" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
    <button id="gateBtn" class="btn" type="submit" style="width:100%;margin-top:8px">Sign in</button>
    <div id="gateMsg" class="gatemsg"></div>
  </form>
</div>

<div class="topbar">
  <a class="wordmark" href="index.html" title="Back to Teams" style="text-decoration:none">JOURNEY<span>.STORAGE</span></a>
  <nav class="nav" id="nav"></nav>
  <div class="top-right">
    <span id="whoami" style="font-size:12px;color:var(--ink3)"></span>
    <button class="btn small" onclick="openAdd()">+ Add investor</button>
    <button class="btn small ghost" onclick="exportJSON()">Export</button>
    <button class="btn small ghost" onclick="signOut()">Sign out</button>
  </div>
</div>

<div class="page" id="page"></div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script id="DB" type="application/json">{"meta":{},"deals":[],"people":[],"familyOffices":[],"findersBrokers":[],"slDirectory":[]}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script>
/* ============ APP JS INJECTED BELOW ============ */
"use strict";
/* ================= DATA & STATE ================= */
const DB = JSON.parse(document.getElementById('DB').textContent);
const todayISO = () => new Date().toISOString().slice(0,10);
const TODAY = todayISO();

const STAGES = {
  funded:        {label:'Funded',            order:1},
  committed:     {label:'Committed',         order:2},
  engaged:       {label:'In Conversation',   order:3},
  lead:          {label:'Active Lead',       order:4},
  backup:        {label:'Backup Plan',       order:5},
  finder:        {label:'Finder — Active',   order:6},
  connector:     {label:'Connector',         order:7},
  gatekept:      {label:'Gatekept',          order:8},
  needs_contact: {label:'Needs Contact Info',order:9},
  finder_inactive:{label:'Finder — Inactive',order:10},
  out:           {label:'Out',               order:11},
};
const BOARD_COLS = ['funded','committed','engaged','lead','backup','finder','connector','gatekept','needs_contact','out'];

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$ = n => n==null||n===''?'':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return MONTHS[+m-1]+' '+(+d)+(y!=TODAY.slice(0,4)?' ’'+y.slice(2):''); }
function daysFromToday(iso){ if(!iso) return null; return Math.round((new Date(iso+'T00:00')-new Date(TODAY+'T00:00'))/864e5); }
function dueClass(iso){ const d=daysFromToday(iso); if(d==null)return'later'; if(d<0)return'overdue'; if(d===0)return'today'; if(d<=3)return'soon'; return'later'; }
function dueText(iso){ const d=daysFromToday(iso); if(d==null)return''; if(d<0)return Math.abs(d)+'d overdue'; if(d===0)return'Today'; if(d===1)return'Tomorrow'; return fmtDate(iso); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
const dealName = id => (DB.deals.find(d=>d.id===id)||{}).name||id;
const personById = id => DB.people.find(p=>p.id===id);
function chip(stage){ const s=STAGES[stage]||{label:stage}; return `<span class="chip ${esc(stage)}">${esc(s.label)}</span>`; }

/* ================= NAV / ROUTER ================= */
const TABS=[['dash','Dashboard'],['fu','Follow-Ups'],['inv','Investors'],['granbury','Granbury'],['springfield','Springfield'],['net','Network'],['pros','Prospects'],['ty','Thank Yous']];
let route='dash', prosTab='fo', invFilter={q:'',deal:'',stage:''}, sortKey='name', sortAsc=true;
function nav(){ $('#nav').innerHTML = TABS.map(([id,l])=>`<button class="${route===id?'on':''}" onclick="go('${id}')">${l}</button>`).join(''); }
function go(r){ route=r; nav(); render(); window.scrollTo(0,0); }
function render(){
  const P=$('#page');
  if(route==='dash') P.innerHTML=vDash();
  else if(route==='fu') P.innerHTML=vFollowUps();
  else if(route==='inv') P.innerHTML=vInvestors();
  else if(route==='granbury'||route==='springfield') P.innerHTML=vDeal(route);
  else if(route==='net') P.innerHTML=vNetwork();
  else if(route==='pros') P.innerHTML=vProspects();
  else if(route==='ty') P.innerHTML=vThankYous();
}

/* ================= COMPUTED ================= */
function dealEntries(dealId){ return DB.people.filter(p=>p.deals[dealId]).map(p=>({p,e:p.deals[dealId]})); }
function dealStats(dealId){
  const es=dealEntries(dealId);
  const funded=es.filter(x=>x.e.funded);
  const committed=es.filter(x=>x.e.stage==='committed');
  const fundedSum=funded.reduce((s,x)=>s+(+x.e.amount||0),0);
  const commitSum=committed.reduce((s,x)=>s+(+x.e.amount||0),0);
  const backupSum=es.reduce((s,x)=>s+(+x.e.backupAmount||0)+(x.e.stage==='backup'?(+x.e.amount||0):0),0);
  const leads=es.filter(x=>['lead','engaged'].includes(x.e.stage));
  const outs=es.filter(x=>x.e.stage==='out');
  return {es,funded,committed,fundedSum,commitSum,backupSum,leads,outs};
}
function followUpItems(){
  const items=[];
  DB.people.forEach(p=>{ for(const [d,e] of Object.entries(p.deals)){ if(e.nextFollowUp && e.stage!=='out') items.push({p,e,deal:d}); } });
  items.sort((a,b)=>a.e.nextFollowUp.localeCompare(b.e.nextFollowUp)||a.p.name.localeCompare(b.p.name));
  return items;
}

/* ================= VIEWS ================= */
function pagehead(kicker,titleHtml,sub,extra=''){
  return `<div class="crumb"><a href="index.html">Teams</a> › <a onclick="go('dash')">Investors</a></div>
  <div class="pagehead"><div><div class="kicker">${kicker}</div><h1 class="pagetitle">${titleHtml}</h1><div class="pagesub">${sub}</div></div>${extra}</div>`;
}

function vDash(){

    <td><span class="nm">${esc(x.p.name)}</span><div class="grp">${esc(x.p.group)}</div></td>

function moneyTable(g){

  rows.map(x=>`<tr onclick="openPerson(${x.p.id})">

function vInvestors(){
  let rows=DB.people.filter(p=>{
    const q=invFilter.q.toLowerCase();
    if(q && !(p.name+' '+p.group+' '+p.introducer+' '+(p.emails||[]).join(' ')).toLowerCase().includes(q)) return false;
    if(invFilter.deal && !p.deals[invFilter.deal]) return false;
    if(invFilter.stage){ const st=Object.values(p.deals).map(e=>e.stage); if(!st.includes(invFilter.stage)) return false; }
    return true;
  });
  const val=p=>{ switch(sortKey){
    case 'name': return p.name.toLowerCase();
    case 'group': return (p.group||'').toLowerCase();
    case 'intro': return (p.introducer||'').toLowerCase();
    case 'amount': return Math.max(...Object.values(p.deals).map(e=>+e.amount||0),0);
    case 'next': return Object.values(p.deals).map(e=>e.nextFollowUp||'9999').sort()[0]||'9999';
    default: return p.name.toLowerCase(); } };
  rows.sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:0)*(sortAsc?1:-1);});
  const opts=Object.entries(STAGES).map(([k,v])=>`<option value="${k}" ${invFilter.stage===k?'selected':''}>${v.label}</option>`).join('');
  return pagehead('Investors · Master List','All <b>Investors</b>',`${rows.length} of ${DB.people.length} people`,
   `<button class="btn" onclick="openAdd()">+ Add investor</button>`)+`
  <div class="toolbar">
    <div class="search"><input placeholder="Search name, group, introducer, email…" value="${esc(invFilter.q)}" oninput="invFilter.q=this.value;render();" onfocus="const v=this.value;this.value='';this.value=v;"></div>
    <select onchange="invFilter.deal=this.value;render()"><option value="">Both deals</option><option value="granbury" ${invFilter.deal==='granbury'?'selected':''}>Granbury</option><option value="springfield" ${invFilter.deal==='springfield'?'selected':''}>Springfield</option></select>
    <select onchange="invFilter.stage=this.value;render()"><option value="">Any status</option>${opts}</select>
  </div>
  <div class="panel"><table><thead><tr>
    <th onclick="setSort('name')">Name ${arrow('name')}</th>
    <th onclick="setSort('group')">Group ${arrow('group')}</th>
    <th onclick="setSort('intro')">Introducer ${arrow('intro')}</th>
    <th>Granbury</th><th>Springfield</th>
    <th class="right" onclick="setSort('amount')">Amount ${arrow('amount')}</th>
    <th class="right" onclick="setSort('next')">Next touch ${arrow('next')}</th></tr></thead><tbody>`+
  rows.map(p=>{
    const g=p.deals.granbury,s=p.deals.springfield;
    const amt=Math.max(...Object.values(p.deals).map(e=>+e.amount||0),0);
    const nxt=Object.values(p.deals).map(e=>e.nextFollowUp).filter(Boolean).sort()[0];
    return `<tr onclick="openPerson(${p.id})">
      <td><span class="nm">${esc(p.name)}</span>${p.emails&&p.emails.length?`<div class="grp">${esc(p.emails[0])}</div>`:''}</td>
      <td>${esc(p.group)}</td><td>${esc(p.introducer)}</td>
      <td>${g?chip(g.stage):'<span class="muted">—</span>'}</td>
      <td>${s?chip(s.stage):'<span class="muted">—</span>'}</td>
      <td class="right"><span class="amount">${amt?fmt$(amt):''}</span></td>
      <td class="right"><span class="due ${dueClass(nxt)}">${nxt?dueText(nxt):'—'}</span></td></tr>`;}).join('')+
  '</tbody></table></div>';
}
function arrow(k){ return sortKey===k?(sortAsc?'↑':'↓'):''; }
function setSort(k){ if(sortKey===k)sortAsc=!sortAsc; else{sortKey=k;sortAsc=true;} render(); }

function vNetwork(){
  const map={};
  DB.people.forEach(p=>{ for(const [d,e] of Object.entries(p.deals)){
    const intro=(p.introducer||'').trim(); if(!intro||/^n\/a/i.test(intro)) continue;
    map[intro]=map[intro]||{name:intro,total:0,active:0,committed:0,funded:0};
    map[intro].total++;
    if(e.stage!=='out') map[intro].active++;
    if(['committed','funded'].includes(e.stage)) map[intro].committed+=(+e.amount||0);
    if(e.funded) map[intro].funded+=(+e.amount||0);
  }});
  const rows=Object.values(map).sort((a,b)=>b.funded-a.funded||b.committed-a.committed||b.total-a.total);
  return pagehead('Investors · Relationship Map','The <b>Network</b>','Who opens doors — every introducer ranked by what their intros produced.')+`
  <div class="panel"><div class="panel-h"><h3>Introducer leaderboard</h3><span class="sub">${rows.length} sources</span></div>
  <table><thead><tr><th></th><th>Introducer / source</th><th class="right">Intros</th><th class="right">Still active</th><th class="right">$ committed</th><th class="right">$ funded</th></tr></thead><tbody>`+
  rows.map((r,i)=>`<tr onclick="invFilter={q:'${esc(r.name).replace(/'/g,"\\'")}',deal:'',stage:''};go('inv')">
    <td class="leader-rank">${i+1}</td><td><span class="nm">${esc(r.name)}</span></td>
    <td class="right">${r.total}</td><td class="right">${r.active}</td>
    <td class="right"><span class="amount">${r.committed?fmt$(r.committed):''}</span></td>
    <td class="right"><span class="amount" style="color:#7cc492">${r.funded?fmt$(r.funded):''}</span></td></tr>`).join('')+
  '</tbody></table></div>';
}

/* ================= ACTIONS ================= */
function markDone(id,deal){ const e=personById(id).deals[deal]; e.lastOutreach=TODAY; e.lastConnection=TODAY; e.nextFollowUp=''; persist(); render(); openPerson(id,deal,true); toast('Logged today — set the next touch date'); }
function snooze(id,deal,days){ const e=personById(id).deals[deal]; const base=e.nextFollowUp&&daysFromToday(e.nextFollowUp)>0?e.nextFollowUp:TODAY; const d=new Date(base+'T00:00'); d.setDate(d.getDate()+days); e.nextFollowUp=d.toISOString().slice(0,10); persist(); render(); toast('Snoozed to '+fmtDate(e.nextFollowUp)); }

  $('#drawer').classList.add('open'); $('#overlay').classList.add('open');
}
function nextBizDay(n){ const d=new Date(TODAY+'T00:00'); d.setDate(d.getDate()+n); if(d.getDay()===6)d.setDate(d.getDate()+2); if(d.getDay()===0)d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
function p_set(id,deal,field,val){ personById(id).deals[deal][field]=val; if(field==='stage'){ personById(id).deals[deal].funded = val==='funded'; } persist(); render(); }
function logTouch(id,deal){ const e=personById(id).deals[deal]; e.lastOutreach=TODAY; e.lastConnection=TODAY; persist(); render(); openPerson(id); toast('Touch logged for today'); }
function addToDeal(id,deal){ personById(id).deals[deal]={stage:'lead',section:'lead',amount:null,funded:false,lastOutreach:'',lastConnection:'',nextFollowUp:'',notes:'',backupAmount:null}; persist(); render(); openPerson(id); toast('Added to '+dealName(deal)); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#overlay').classList.remove('open'); openId=null; }

/* ================= ADD MODAL ================= */
function openAdd(){ prefillAdd('',''); }
function prefillAdd(name,group){
  $('#modal').innerHTML=`<div class="modal-in">
    <h2>Add investor</h2><div class="muted">New relationship in the database</div>
    <label class="f">Name *</label><input type="text" id="a_name" value="${esc(name)}">
    <label class="f">Investor group / company</label><input type="text" id="a_group" value="${esc(group)}">
    <label class="f">Introducer</label><input type="text" id="a_intro">
    <label class="f">Email</label><input type="text" id="a_email">
    <label class="f">Deal</label><select id="a_deal" style="width:100%"><option value="granbury">Granbury</option><option value="springfield">Springfield</option><option value="">None yet</option></select>
    <label class="f">Status</label><select id="a_stage" style="width:100%">${Object.entries(STAGES).map(([k,v])=>`<option value="${k}" ${k==='lead'?'selected':''}>${v.label}</option>`).join('')}</select>
    <label class="f">Amount ($)</label><input type="number" id="a_amount">
    <label class="f">Next follow-up</label><input type="date" id="a_next" value="${nextBizDay(1)}">
    <label class="f">Notes</label><textarea id="a_notes"></textarea>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn" onclick="saveAdd()">Save investor</button>
      <button class="btn ghost" onclick="$('#modal').classList.remove('open')">Cancel</button>
    </div></div>`;
  $('#modal').classList.add('open');
}
function saveAdd(){
  const name=$('#a_name').value.trim(); if(!name){ toast('Name is required'); return; }
  const p={id:Math.max(...DB.people.map(p=>p.id))+1,name,group:$('#a_group').value.trim(),introducer:$('#a_intro').value.trim(),
    emails:$('#a_email').value.trim()?[$('#a_email').value.trim()]:[],roles:[],deals:{},thankYou:null};
  const deal=$('#a_deal').value;
  if(deal) p.deals[deal]={stage:$('#a_stage').value,section:$('#a_stage').value,amount:$('#a_amount').value?+$('#a_amount').value:null,
    funded:$('#a_stage').value==='funded',lastOutreach:'',lastConnection:'',nextFollowUp:$('#a_next').value,notes:$('#a_notes').value,backupAmount:null};
  DB.people.push(p); DB.people.sort((a,b)=>a.name.localeCompare(b.name)); persist();
  $('#modal').classList.remove('open'); render(); openPerson(p.id); toast('Investor added');
}

/* ================= EXPORT ================= */
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='investors_db_'+TODAY+'.json'; a.click(); toast('Database exported');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); $('#modal').classList.remove('open'); } });

/* ================= PORTAL AUTH + SUPABASE PERSISTENCE ================= */
const CFG = window.JOURNEY_CONFIG || {};
const ALLOWED = ['lyvia@journey.storage','jonah@journey.storage'];
const CLIENT = Math.random().toString(36).slice(2);
let sb=null, persistTimer=null, READONLY=false;
try{ if(CFG.SUPABASE_URL && window.supabase) sb=supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); }catch(e){}

function setDB(obj){ for(const k of Object.keys(DB)) delete DB[k]; Object.assign(DB, obj||{}); }

async function loadRemote(){
  if(!sb){ READONLY=true; return; }
  try{
    const { data, error } = await sb.from('investor_db').select('data').eq('id','main').maybeSingle();
    if(error) throw error;
    if(data && data.data){ setDB(data.data); return; }
    // First run and the table is empty — nothing to show yet.
    READONLY=true;
    toast('No data yet — run the one-time seed in Supabase');
  }catch(e){ console.warn('load failed', e); READONLY=true; toast('Could not load — changes will not save'); }
}

function persist(){
  if(READONLY || !sb) return;
  clearTimeout(persistTimer);
  persistTimer=setTimeout(async ()=>{
    try{
      const { error } = await sb.from('investor_db')
        .upsert({id:'main', data:DB, writer:CLIENT, updated_at:new Date().toISOString()});
      if(error) throw error;
    }catch(e){ console.warn('save failed', e); toast('Save failed — Export a backup'); }
  }, 700);
}

function subscribeRealtime(){
  if(!sb) return;
  sb.channel('investor_db')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'investor_db'}, payload=>{
      const row=payload.new;
      if(!row || row.writer===CLIENT || !row.data) return;         // ignore our own echo
      const el=document.activeElement;
      const busy=(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))
        || $('#drawer').classList.contains('open')
        || $('#modal').classList.contains('open');
      if(busy) return;                                             // don't clobber an active edit
      setDB(row.data); render();
    }).subscribe();
}

function showGate(msg){
  document.body.classList.remove('authed');
  const m=$('#gateMsg'); if(m) m.textContent=msg||'';
  const pg=$('#page'); if(pg) pg.innerHTML='';                     // clear rendered data on sign-out
  closeDrawer(); const md=$('#modal'); if(md) md.classList.remove('open');
}

function signOut(){ if(sb) sb.auth.signOut(); }

async function afterAuth(email){
  if(!ALLOWED.includes(String(email||'').trim().toLowerCase())){
    if(sb) await sb.auth.signOut();
    showGate('This workspace is restricted to Lyvia and Jonah.');
    return;
  }
  await loadRemote();
  const w=$('#whoami'); if(w) w.textContent=email;
  document.body.classList.add('authed');
  subscribeRealtime();
  nav(); render();
}

async function boot(){
  if(!sb){ showGate('Sign-in unavailable — config missing.'); return; }
  const form=$('#gateForm');
  if(form) form.addEventListener('submit', async e=>{
    e.preventDefault();
    const b=$('#gateBtn'); b.disabled=true; $('#gateMsg').textContent='Signing in…';
    const { error }=await sb.auth.signInWithPassword({ email:$('#gateEmail').value.trim(), password:$('#gatePass').value });
    if(error){ $('#gateMsg').textContent=error.message; b.disabled=false; }
  });
  sb.auth.onAuthStateChange((_e,session)=>{
    if(session && session.user){ if(!document.body.classList.contains('authed')) afterAuth(session.user.email); }
    else showGate('');
  });
  const { data }=await sb.auth.getSession();
  if(data.session && data.session.user) afterAuth(data.session.user.email); else showGate('');
}
boot();

</script>
