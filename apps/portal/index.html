<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey.storage — Portal</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://journey.storage">
<link rel="preload" href="fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/lato-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted Lato (latin subset) — removes the render-blocking Google Fonts request. */
  @font-face{font-family:'Lato';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/lato-300.woff2') format('woff2');}
  @font-face{font-family:'Lato';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/lato-400.woff2') format('woff2');}
  @font-face{font-family:'Lato';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/lato-700.woff2') format('woff2');}
  @font-face{font-family:'Lato';font-style:normal;font-weight:900;font-display:swap;src:url('fonts/lato-900.woff2') format('woff2');}
  :root{
    --bg:#181818; --bg-2:#141312; --surface:#201f1d; --surface-2:#272523; --line:#34312d;
    --ink:#f5f0e8; --ink-soft:#a7a29a; --ink-faint:#6f6a62;
    --accent:#e8622a; --accent-press:#cf5421; --accent-tint:#33231a;
    --done:#5fa377; --done-tint:#1e2b22;
    --logo:url('https://journey.storage/images/brand/logo-white-TM.svg');
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Lato',-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  .logo-img{display:block;height:16px;width:auto;}
  .logo-img.lg{height:19px;}
  #homeLogo{cursor:pointer;}
  .bg-word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Lato',Arial,sans-serif;font-weight:900;font-size:34vw;line-height:1;color:#fff;opacity:.04;letter-spacing:-.03em;pointer-events:none;user-select:none;z-index:0;overflow:hidden;white-space:nowrap;}
  .bg-word.fixed{position:fixed;}

  /* ───── LOGIN ───── */
  #login{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1100px 620px at 50% -10%, #211f1d 0%, var(--bg) 62%);}
  .login-card{position:relative;z-index:1;width:100%;max-width:412px;background:rgba(32,31,29,.86);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:42px 38px;}
  .login-card .logo-img{margin-bottom:30px;}
  .login-card h1{font-size:26px;font-weight:300;margin-bottom:8px;letter-spacing:-.01em;}
  .login-card h1 b{font-weight:900;}
  .login-card p.lead{color:var(--ink-soft);font-size:14px;margin-bottom:28px;line-height:1.55;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;}
  .field input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);background:#1a1917;border-radius:10px;padding:12px 14px;}
  .field input::placeholder{color:var(--ink-faint);}
  .field input:focus{outline:none;border-color:var(--accent);}
  .btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:700;letter-spacing:.01em;transition:background .18s;}
  .btn-primary:hover{background:var(--accent-press);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .msg{font-size:13px;margin-top:16px;text-align:center;min-height:18px;line-height:1.5;}
  .msg.error{color:#e8866a;}
  .preview-link{display:block;text-align:center;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
  .preview-link a{color:var(--ink-soft);font-size:13px;text-decoration:none;border-bottom:1px dotted var(--ink-faint);padding-bottom:2px;cursor:pointer;}
  .preview-link a:hover{color:var(--accent);border-color:var(--accent);}

  /* ───── SITE-STYLE HEADER ───── */
  .topbar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 30px;background:var(--bg-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .topbar .left{display:flex;align-items:center;gap:34px;}
  .nav{display:flex;align-items:center;gap:28px;}
  .nav a{color:var(--ink);font-size:14px;font-weight:700;letter-spacing:.01em;text-decoration:none;cursor:pointer;opacity:.75;transition:opacity .15s,color .15s;}
  .nav a:hover{opacity:1;color:var(--accent);}
  .nav a.active{opacity:1;color:var(--ink);position:relative;}
  .nav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-22px;height:2px;background:var(--accent);}
  .topbar .right{display:flex;align-items:center;gap:16px;}
  .badge-preview{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-tint);border:1px solid #4a3526;border-radius:99px;padding:5px 11px;}
  .user-email{font-size:13px;color:var(--ink-soft);}
  .btn-pill{background:var(--accent);color:#fff;border:none;border-radius:24px;padding:9px 18px;font-size:13px;font-weight:700;letter-spacing:.01em;}
  .btn-pill:hover{background:var(--accent-press);}

  main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:36px 30px 90px;}
  .crumb{font-size:13px;color:var(--ink-soft);margin-bottom:22px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .crumb a{color:var(--accent);text-decoration:none;cursor:pointer;}
  .crumb a:hover{text-decoration:underline;}
  .crumb .sep{color:var(--ink-faint);}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:6px;}
  .page-head .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px;}
  .page-head h2{font-size:33px;font-weight:300;letter-spacing:-.01em;}
  .page-head h2 b{font-weight:900;}
  .page-head .sub{color:var(--ink-soft);font-size:15px;margin-top:8px;max-width:640px;line-height:1.55;}
  .btn-accent{background:var(--accent);color:#fff;border:none;border-radius:24px;padding:11px 20px;font-size:14px;font-weight:700;}
  .btn-accent:hover{background:var(--accent-press);}

  /* ───── DASHBOARD ───── */
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:30px;}
  .proj-card{background:var(--ink);border:1px solid #e6dfd2;border-radius:16px;padding:26px 24px;cursor:pointer;transition:transform .2s,box-shadow .2s;color:#1a1817;}
  .proj-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.45);}
  .proj-card .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:900;}
  .proj-card h3{font-size:21px;font-weight:900;margin:12px 0 8px;line-height:1.25;color:#1a1817;}
  .proj-card p{font-size:14px;color:#6a655d;line-height:1.5;}
  .proj-card .stat{margin-top:20px;display:flex;align-items:center;gap:10px;}
  .proj-card .mini-track{flex:1;height:6px;background:rgba(26,24,23,.12);border-radius:99px;overflow:hidden;}
  .proj-card .mini-fill{height:100%;width:0;background:var(--accent);transition:width .35s;}
  .proj-card .mini-num{font-size:12px;color:#6a655d;white-space:nowrap;font-weight:700;}
  .dept-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px;cursor:pointer;transition:border-color .2s,transform .2s,background .2s;}
  .dept-card:hover{transform:translateY(-2px);border-color:#52483f;background:var(--surface-2);}
  .dept-card .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .dept-card h3{font-size:22px;font-weight:900;margin:12px 0 8px;line-height:1.25;color:var(--ink);}
  .dept-card p{font-size:14px;color:var(--ink-soft);line-height:1.5;}
  .dept-card .cnt{margin-top:18px;font-size:13px;color:var(--ink-faint);letter-spacing:.04em;}

  /* ───── BOARD (TABLE) ───── */
  .bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:26px 0 18px;padding:18px 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  .progress-text{font-size:14px;color:var(--ink-soft);}
  .progress-text strong{color:var(--ink);font-size:22px;font-weight:900;}
  .track{flex:1;min-width:180px;height:8px;background:#322d29;border-radius:99px;overflow:hidden;}
  .fill{height:100%;width:0;background:var(--accent);transition:width .35s;}

  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  thead th{font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-soft);text-align:left;font-weight:700;padding:15px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);}
  thead th.c{text-align:center;}
  tbody td{padding:15px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .15s;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.done{background:var(--done-tint);}
  tbody tr.done:hover{background:#243029;}
  td.num{color:var(--accent);font-weight:900;font-size:13px;letter-spacing:.06em;width:64px;}
  td.post{font-weight:700;}
  td.open{cursor:pointer;}
  tr:hover td.open .post-link{color:var(--accent);}
  .post-link{transition:color .15s;}
  .post-arrow{color:var(--ink-faint);font-weight:400;margin-left:8px;}
  td.fmt{color:var(--ink-soft);font-size:13px;font-style:italic;letter-spacing:.01em;width:190px;white-space:nowrap;}
  td.status{text-align:center;width:170px;}
  td.date{width:170px;}
  .sec-title{margin:36px 0 14px;font-size:14px;font-weight:900;letter-spacing:.02em;color:var(--ink);display:flex;align-items:center;gap:10px;text-transform:uppercase;}
  .sec-count{font-size:12px;font-weight:700;color:var(--done);background:var(--done-tint);border:1px solid #2f4a39;border-radius:99px;padding:2px 9px;}
  .done-wrap{opacity:.94;}
  td.reopen-cell{width:112px;text-align:right;}
  .reopen{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:12px;letter-spacing:.03em;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .reopen:hover{border-color:var(--accent);color:var(--accent);}
  .all-done{text-align:center;color:var(--done);background:var(--done-tint);border:1px solid #2f4a39;border-radius:14px;padding:26px;font-size:15px;font-weight:700;}
  .btn-post{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.03em;cursor:pointer;}
  .btn-post:hover{background:var(--accent-press);}
  .rejbtn{background:transparent;border:1px solid var(--line);color:var(--ink-faint);font-size:12px;letter-spacing:.03em;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .rejbtn:hover{border-color:#b4453a;color:#b4453a;}
  .btn-rej{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer;}
  .btn-rej:hover:not([disabled]){border-color:#b4453a;color:#b4453a;}
  .btn-rej[disabled]{color:#b4453a;border-color:#b4453a;opacity:.7;cursor:default;}
  tr.rejected-row .post-link{text-decoration:line-through;color:var(--ink-faint);}
  .stage-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;font-size:12px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;}
  .stage-flow .on{color:var(--accent);font-weight:700;}
  .stage-flow .ar{color:var(--ink-faint);}

  .check{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .check input{display:none;}
  .check.locked{opacity:.35;cursor:not-allowed;}
  .box{width:22px;height:22px;border-radius:6px;border:2px solid #4a443d;flex:none;display:flex;align-items:center;justify-content:center;transition:all .18s;background:#1a1917;}
  .check input:checked + .box{background:var(--done);border-color:var(--done);}
  .box svg{opacity:0;transform:scale(.5);transition:all .18s;}
  .check input:checked + .box svg{opacity:1;transform:scale(1);}
  input[type=date]{width:100%;font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line);background:#1a1917;border-radius:8px;padding:8px 10px;}
  input[type=date]:focus{outline:none;border-color:var(--accent);}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7);}

  /* ───── ASSET DROP ZONES ───── */
  td.asset{width:152px;}
  .dz{border:1.5px dashed #4a443d;border-radius:8px;background:#1a1917;color:var(--ink-faint);font-size:12px;text-align:center;padding:11px 8px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;}
  .dz:hover,.dz.over{border-color:var(--accent);color:var(--accent);background:#211c18;}
  .asset-thumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer;}
  .asset-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:#222;}
  .asset-chip{font-size:11px;color:var(--ink-soft);background:#222;border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .asset-more{font-size:11px;color:var(--ink-faint);}
  .dz-lg{border:2px dashed #4a443d;border-radius:14px;background:#1a1917;text-align:center;padding:38px 24px;cursor:pointer;transition:all .15s;}
  .dz-lg:hover,.dz-lg.over{border-color:var(--accent);background:#221c18;}
  .dz-lg .big{font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:700;}
  .dz-lg .small{font-size:12px;color:var(--ink-faint);}
  .alink{width:100%;background:#1a1917;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-size:13px;padding:8px 10px;}
  .alink:focus{outline:none;border-color:var(--accent);}
  .asset-link-chip{display:inline-block;color:var(--accent);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap;}
  .asset-link-chip:hover{border-color:var(--accent);}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:18px;}
  .gitem{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#1a1917;}
  .gitem img{width:100%;height:104px;object-fit:cover;display:block;}
  .gitem .file{display:flex;align-items:center;justify-content:center;height:104px;font-size:12px;color:var(--ink-soft);padding:8px;text-align:center;text-decoration:none;}
  .gitem .name{font-size:11px;color:var(--ink-soft);padding:8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gitem .rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .gitem .rm:hover{background:var(--accent);}

  /* ───── POST DETAIL ───── */
  .detail-status{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin:24px 0 28px;padding:18px 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  .detail-status .check .lbl{font-size:13px;color:var(--ink-soft);letter-spacing:.02em;}
  .detail-status .check input:checked ~ .lbl{color:var(--done);font-weight:700;}
  .detail-status .dt{display:flex;align-items:center;gap:10px;}
  .detail-status .dt label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .detail-status .dt input[type=date]{width:160px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;}
  @media (max-width:760px){ .detail-grid{grid-template-columns:1fr;} td.fmt{display:none;} thead th.fmt-h{display:none;} }
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 26px 28px;}
  .panel h4{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:16px;}
  .panel .visual-txt{color:var(--ink-soft);font-size:15px;line-height:1.65;}
  .panel .caption-txt{color:var(--ink);font-size:16px;line-height:1.7;white-space:pre-wrap;}
  .panel .copy-btn{margin-top:20px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:12px;letter-spacing:.04em;padding:8px 14px;border-radius:8px;cursor:pointer;}
  .panel .copy-btn:hover{border-color:var(--accent);color:var(--accent);}
  .panel .caption-edit{width:100%;min-height:340px;background:#1a1917;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:16px;line-height:1.7;padding:14px;resize:vertical;}
  .panel .caption-edit:focus{outline:none;border-color:var(--accent);}
  .cap-actions{display:flex;gap:10px;align-items:center;margin-top:14px;}
  .cap-actions .copy-btn{margin-top:0;}
  .cap-saved{color:var(--done);font-size:12px;letter-spacing:.04em;opacity:0;transition:opacity .2s;}
  .cap-saved.on{opacity:1;}

  /* ───── AUTO FEED ───── */
  .proj-card .auto-note{margin-top:18px;font-size:12px;color:#6a655d;letter-spacing:.05em;text-transform:uppercase;font-weight:700;}
  .feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:18px;margin-top:24px;}
  .feed-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .feed-card .img{width:100%;height:188px;object-fit:cover;display:block;background:#222;}
  .feed-card .ph{height:188px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;background:#1c1b19;text-align:center;padding:14px;}
  .feed-card .meta{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1;}
  .feed-card .meta .t{font-weight:700;font-size:15px;line-height:1.3;}
  .feed-card .meta .s{font-size:12px;color:var(--accent);margin-top:7px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
  .feed-card .meta .d{font-size:12px;color:var(--ink-faint);margin-top:7px;}
  .feed-card .fc{margin-top:14px;align-self:flex-start;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:12px;letter-spacing:.04em;padding:7px 12px;border-radius:8px;}
  .feed-card .fc:hover{border-color:var(--accent);color:var(--accent);}

  /* ───── ACCOUNTING LEDGER ───── */
  .ledger-dz{border:2px dashed #4a443d;border-radius:14px;background:#1a1917;text-align:center;padding:30px 24px;cursor:pointer;margin-top:18px;transition:all .15s;}
  .ledger-dz:hover,.ledger-dz.over{border-color:var(--accent);background:#221c18;}
  .ledger-dz .big{font-size:15px;color:var(--ink);font-weight:700;margin-bottom:6px;}
  .ledger-dz .small{font-size:12px;color:var(--ink-faint);}
  .ledger-totals{align-items:flex-end;gap:40px;}
  .lt-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .lt-val{font-size:22px;font-weight:900;color:var(--ink);margin-top:4px;}
  .lt-val.accent{color:var(--accent);}
  input.led{width:100%;font-family:inherit;font-size:14px;color:var(--ink);border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;}
  input.led:hover{border-color:var(--line);}
  input.led:focus{outline:none;border-color:var(--accent);background:#1a1917;}
  input.led.amt{font-weight:700;}
  td.doc{width:96px;}
  .scan{font-size:11px;color:var(--accent);display:block;margin-top:4px;}
  .del:hover{border-color:#9c4a3c !important;color:#e8866a !important;}

  /* ───── MODAL ───── */
  .overlay{position:fixed;inset:0;background:rgba(8,8,8,.62);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:440px;}
  .modal h3{font-size:22px;font-weight:400;margin-bottom:20px;}
  .modal .btn-row{display:flex;gap:10px;margin-top:8px;}
  .modal textarea{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);background:#1a1917;color:var(--ink);border-radius:10px;padding:12px;resize:vertical;min-height:84px;}
  .modal textarea:focus{outline:none;border-color:var(--accent);}

  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px;}

  .mkt-add:hover{border-color:var(--accent);color:var(--accent);}
  .mkt-empty{color:var(--ink-faint);font-size:12px;font-style:italic;padding:14px 2px;text-align:center;border:1px dashed var(--line);border-radius:11px;}
  @media (max-width:900px){ .mkt-board{grid-template-columns:1fr;} .mkt-summary{grid-template-columns:repeat(2,1fr);} }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>

<script>
(function(){
  const cfg = window.JOURNEY_CONFIG || {};
  const configured = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf("PASTE_") === -1;
  const $ = s => document.querySelector(s);
  const checkSVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  const sb = configured ? supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
  let mode = null, liveChannel = null, ctx = {};
  // Ids of ledger rows currently being read (Gemini/parse in flight) — drives the "Reading…" badge.
  let ledgerReading = {};
  // PDF.js is only needed when a user uploads a PDF (post-login). Load it on demand
  // so the login screen and dashboard don't pay for ~90KB up front.
  let _pdfjsPromise=null;
  function ensurePdfjs(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if(_pdfjsPromise) return _pdfjsPromise;
    _pdfjsPromise=new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.integrity='sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e';
      s.crossOrigin='anonymous';
      s.onload=()=>{ try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){} resolve(window.pdfjsLib); };
      s.onerror=()=>{ _pdfjsPromise=null; reject(new Error('pdfjs load failed')); };
      document.head.appendChild(s);
    });
    return _pdfjsPromise;
  }

  // ───── CONTENT (preview seed; also lives in Supabase once seeded) ─────
  const POSTS = [
    ["Why we chose Granbury.","Photo · Square at sunset",
      "A long shot of the Granbury square at sunset.",
      "A few reasons. The population is growing. The pace is human. The town is welcoming new families and new businesses without forgetting what it was.\n\nWe wanted to build something modern in a place that values the long version of staying.\n\nGranbury, we're glad to be here."],
    ["How a customer becomes a customer.","Reel · 60-sec time-lapse",
      "A 60-second Reel. Time-lapse from website visit to keys in hand. Phone-shot, ambient audio.",
      "From the first website visit to keys in hand, in under fifteen minutes.\n\nWe mapped the journey. The booking page. The ID upload. The auto-generated access code. The drive over. The walk to the unit. The first time the corridor light turns on.\n\nMost storage takes hours of friction. We took most of that out.\n\nWhat we left in: a real conversation if you want one. Not because the system needs it. Because we do."],
    ["Starting over isn't always loud.","Photo / Typographic",
      "A single quiet hallway in the facility. Warm overhead light. Empty corridor. Cinematic stillness. Or: text-only typographic post.",
      "Sometimes it's a single duffel bag. A folded couch. A box of books and a box of dishes. The quietest part of a life change is often the part no one sees.\n\nWe see it."],
    ["Texas summer storage tips.","Carousel · 5 slides",
      "Carousel. Five slides.",
      "01. Climate-controlled for anything wood, leather, or electronic.\n02. No food. Heat speeds spoilage.\n03. Air-tight containers for fabrics.\n04. Elevate boxes off the floor.\n05. Visit your unit before peak summer to spot issues early.\n\nThe Texas sun is great for a lot of things. A standard non-climate unit is not one of them."],
    ["What size unit do I actually need?","Carousel · 6 sizes",
      "Carousel.",
      "Six sizes, six rooms, six honest answers.\n\n5×5 / a coat closet\n5×10 / a walk-in closet\n10×10 / a small bedroom\n10×15 / a large bedroom\n10×20 / a one-car garage\n10×30 / a two-car garage\n\nSave this. Come walk one with us when you're ready."],
    ["The college goodbye no one warned you about.","Photo · Moving day",
      "A college dorm in mid-pack-up, seen from a parent's angle. Or: the rear of a loaded car, a hand-written sign in the window.",
      "Moving day diary.\n\nToday: dorm rooms emptied, summer boxes in. June through August, half the unit. September, the other half. The college years come in storage cycles, and the parents are quietly the most prepared people in the building."],
    ["Five things that should not go into storage.","Carousel · 6 slides",
      "Carousel of six slides. Slide 6: a single CTA.",
      "01. Anything with a battery (still in it).\n02. Food. Anything edible. Anything that was edible.\n03. Live plants. Yes, this happens.\n04. Documents you'll need in 30 days.\n05. Anything irreplaceable, without insurance.\n\nSave this for the next move."],
    ["24/7. By design.","Photo · Keypad at night",
      "A clean shot of the keypad/entry at night. Warm interior light spilling through. A single car in the lot.",
      "Our hours: 24/7. Always.\n\nWe chose full automation because life doesn't have hours. Moves happen at 11pm. Business deliveries happen at 5am. Sometimes the only quiet hour you have is between everything else.\n\nWe unlock when you arrive."],
    ["Before and after: garage reclaimed.","Carousel · 2 photos",
      "Two photos: 1) a chaotic garage, 2) the same garage empty and swept. Carousel.",
      "Before. After.\n\nSix weeks ago, this garage held a 2016 Camry, plus everything else. This week, just the car.\n\nThe trick was simple: we asked her to label only three categories. Keep, store, let go. Then the rest sorted itself.\n\nWhat's behind your \"store\" pile?"],
    ["Granbury, Texas. Population: growing.","Photo · Golden hour",
      "Wide shot of the Granbury square or a regional skyline at golden hour.",
      "Every modern town needs modern infrastructure. We built Journey.storage here because the people moving in deserve a self-storage experience that matches the rest of the life they're building.\n\nQuiet, secure, designed for the long version of staying."],
    ["The 6-foot rule of packing.","Reel · Time-lapse",
      "Reel. Time-lapse of someone packing a unit using the 6-foot center aisle rule. Text overlay.",
      "Whatever you put in a storage unit, leave a clear 6-foot aisle down the middle. You'll need to walk back in. You'll need to find one thing. You'll need access to the back wall before you think you will.\n\nThe aisle is the difference between storage and a sealed tomb."],
    ["She runs a vintage shop out of a 10x20.","Portrait · Entrepreneur",
      "Portrait of the entrepreneur in the unit, surrounded by carefully arranged vintage pieces. She's reading a label.",
      "[Name] sources, photographs, and ships everything from a single climate-controlled unit. Her inventory is organized like a museum. Her unit is a small business.\n\nSpace that helps your business grow."],
    ["You can tell a lot about people by what they keep.","Photo · Overhead unit",
      "An overhead shot of a unit interior, organized: a few labeled boxes, a guitar case, a folded baby cot.",
      "We don't read the labels. We don't open the boxes. We just notice the patterns. Things people couldn't leave behind. Things they're holding for later.\n\nEvery box has a story."],
    ["Climate-controlled vs standard: who needs which?","Carousel · 8 slides",
      "Eight-slide carousel. Side-by-side comparisons of items, with one rule per slide.",
      "A two-minute decision guide.\n\nWooden furniture: climate. The Texas humidity will warp glue joints in six months.\nLeather: climate. Same reason.\nPhotographs and documents: climate. Always.\nElectronics: climate if storing more than 30 days.\nMattresses: climate. They are basically a sponge.\nGarden tools, athletic gear, plastic bins: standard is fine.\nBooks and records: climate.\nHoliday decor: standard if sealed.\n\nThe rule of thumb: if it would be ruined by a hot car for a week, it needs climate."],
    ["Baby on the way. Garage needs to clear.","Photo · Young dad",
      "A young dad mid-process, carrying a labeled box. Warm interior lighting.",
      "The bikes have to go somewhere. The kayak. The tools. The boxes from the last move that never got unpacked.\n\nGrowing families don't shrink, but the rooms do. We hold the rest."]
  ];
  // Pipeline stages: copy → design → social. Each project is a stage view of a stream (IG / LinkedIn).
  const STAGES = {
    copy:   {doneKey:'copy_done',   dateKey:'copy_date',      prev:null,         action:'Approved', kicker:'Copy · created here', sub:'Write the copy and drop reference files. Approve a post to send it to Graphic Design.', flow:0},
    design: {doneKey:'design_done', dateKey:'design_date',    prev:'copy_done',  action:'Completed by designer', kicker:'Design', sub:'Approved copy lands here. Drop the finished design and mark it complete to send it to Social Media.', flow:1},
    social: {doneKey:'posted',      dateKey:'posted_date',    prev:'design_done',action:'Posted',   kicker:'Ready to post', sub:'Finished posts ready to schedule. Mark a post as Posted when it goes live.', button:true, flow:2},
    post:   {doneKey:'posted',      dateKey:'posted_date',    prev:'copy_done',  action:'Posted',   kicker:'Ready to post', sub:'Approved copy lands here, ready to publish. Mark a post as Posted when it goes live.', button:true, flow:1, flowArr:['Copy','Social Media']},
    board:  {doneKey:'done',        dateKey:'date_completed', prev:null,         action:'Completed', kicker:'Board', sub:'Tick the box when an item is complete.', flow:-1}
  };
  const FLOW = ['Copy','Graphic Design','Social Media'];
  // Only these people may approve copy.
  const APPROVERS = ['lyvia@journey.storage','jonah@journey.storage'];
  let currentEmail = null;
  function ensureApprover(){
    const ok = e => APPROVERS.includes(String(e||'').trim().toLowerCase());
    if(ok(currentEmail)) return true;
    if(currentEmail){ alert('Only Lyvia or Jonah can approve copy.'); return false; }
    const entered = (window.prompt('Approving copy is restricted to Lyvia or Jonah.\nEnter your Journey.storage email to confirm:')||'');
    if(ok(entered)){ currentEmail = entered.trim().toLowerCase(); return true; }
    alert('Only lyvia@journey.storage or jonah@journey.storage can approve copy.');
    return false;
  }
  // Only these people may see/open the Accounting team.
  const ACCOUNTING_USERS = ['lyvia@journey.storage','jonah@journey.storage'];
  function canAccounting(){ return ACCOUNTING_USERS.includes(String(currentEmail||'').trim().toLowerCase()); }
  function isAccounting(name){ return String(name||'').trim().toLowerCase()==='accounting'; }
  function stageOf(p){ return (p&&p.stage)||'board'; }
  function streamOf(p){ return (p&&p.stream)||(p&&p.id); }

  let previewData = null;
  function seedPreview(){
    previewData = {
      departments:[
        {id:'d4',name:'Copy',description:'Copy, wording, and brand voice. The first step — content is created here.'},
        {id:'d1',name:'Graphic Design',description:'Brand, visual, and content design.'},
        {id:'d2',name:'Social Media',description:'Channels, scheduling, and community.'},
        {id:'d5',name:'Accounting',description:'Billing, invoices, and finance.'},
        {id:'d3',name:'TBD',description:'To be defined.'}
      ],
      projects:[
        {id:'cp_ig',department_id:'d4',name:'IG Content',stream:'IG',stage:'copy',cover:'Copy',description:'Instagram copy — created and approved here.'},
        {id:'cp_li',department_id:'d4',name:'LinkedIn Content',stream:'LinkedIn',stage:'copy',cover:'Copy',description:'LinkedIn copy — created and approved here.'},
        {id:'gd_ig',department_id:'d1',name:'IG Content',stream:'IG',stage:'design',cover:'Design',description:'Design the approved Instagram posts.'},
        {id:'gd_li',department_id:'d1',name:'LinkedIn Content',stream:'LinkedIn',stage:'design',cover:'Design',description:'Design the approved LinkedIn posts.'},
        {id:'sm_ig',department_id:'d2',name:'Ready to Post IG',stream:'IG',stage:'social',cover:'Schedule',description:'Finished Instagram posts ready to publish.'},
        {id:'sm_li',department_id:'d2',name:'Ready to Post LinkedIn',stream:'LinkedIn',stage:'social',cover:'Schedule',description:'Finished LinkedIn posts ready to publish.'},
        {id:'ac_inv',department_id:'d5',name:'Invoices',stage:'ledger',kind:'invoice',cover:'Ledger',description:'Vendor invoices to pay. Drop a file — we read the details.'},
        {id:'ac_rec',department_id:'d5',name:'Receipts',stage:'ledger',kind:'receipt',cover:'Ledger',description:'Receipts for paid expenses. Drop a file — we read the details.'}
      ],
      tasks: POSTS.map((p,i)=>{
        const t={id:'t'+i,stream:'IG',position:i+1,title:p[0],meta:p[1],visual:p[2],body:p[3],copy_done:false,copy_date:'',design_done:false,design_date:'',posted:false,posted_date:'',assets:[],asset_link:'',added:new Date().toISOString().slice(0,10)};
        // Spread the seed across the pipeline so the Marketing board demos all three columns (preview only).
        if(i>=3 && i<6){ t.copy_done=true; t.copy_date='2026-06-30'; t.design_date='2026-07-0'+(i-2); t.asset_link='https://example.com/asset'; }
        else if(i>=6 && i<8){ t.copy_done=true; t.copy_date='2026-06-28'; t.design_done=true; t.design_date='2026-06-30'; t.asset_link='https://example.com/asset'; }
        else if(i===8){ t.copy_done=true; t.copy_date='2026-06-25'; t.design_done=true; t.design_date='2026-06-27'; t.posted=true; t.posted_date='2026-07-01'; t.asset_link='https://example.com/asset'; }
        return t;
      }).concat([
        {id:'li1',stream:'LinkedIn',position:1,title:"Starting over isn't always loud.",meta:'Photo / Typographic',visual:'',body:'',copy_done:false,copy_date:'',design_done:false,design_date:'',posted:false,posted_date:'',assets:[],asset_link:'',added:'2026-06-30'},
        {id:'li2',stream:'LinkedIn',position:2,title:'You can tell a lot by what people keep.',meta:'Photo · Overhead unit',visual:'',body:'',copy_done:true,copy_date:'2026-06-25',design_done:true,design_date:'2026-06-27',posted:true,posted_date:'2026-07-01',assets:[],asset_link:'https://example.com/a',added:'2026-06-20'}

    };

  // ───── DATA LAYER ─────
  async function getDepartments(){
    if(mode==='preview') return previewData.departments;
    const { data, error } = await sb.from('departments').select('*').order('created_at'); if(error) throw error; return data||[];
  }
  async function deptProjectCounts(){
    let rows;
    if(mode==='preview') rows=previewData.projects.map(p=>({department_id:p.department_id}));
    else { const { data } = await sb.from('projects').select('department_id'); rows=data||[]; }
    const c={}; rows.forEach(p=>{ c[p.department_id]=(c[p.department_id]||0)+1; }); return c;
  }
  async function getProjects(deptId){
    if(mode==='preview') return previewData.projects.filter(p=>!deptId||p.department_id===deptId);
    let q=sb.from('projects').select('*').order('created_at'); if(deptId) q=q.eq('department_id',deptId);
    const { data, error } = await q; if(error) throw error; return data||[];
  }
  async function getProject(id){
    if(mode==='preview') return previewData.projects.find(p=>p.id===id);
    const { data } = await sb.from('projects').select('*').eq('id',id).single(); return data;
  }
  async function createDepartment(d){ if(mode==='preview'){ previewData.departments.push({id:'d'+Date.now(),...d}); return;} await sb.from('departments').insert(d); }
  async function getStreamTasks(stream){
    if(mode==='preview') return previewData.tasks.filter(t=>t.stream===stream).sort((a,b)=>(a.position||0)-(b.position||0));
    const { data, error } = await sb.from('tasks').select('*').eq('stream',stream).order('position'); if(error) throw error; return data||[];
  }
  function moneyNum(s){ const n=parseFloat(String(s||'').replace(/[^0-9.]/g,'')); return isNaN(n)?0:n; }
  function money(n){ return '$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  async function projectStats(proj){
    const tasks=await getStreamTasks(streamOf(proj));
    if(stageOf(proj)==='ledger'){ return {ledger:true, n:tasks.length, total:tasks.reduce((a,t)=>a+moneyNum(t.amount),0)}; }
    const cfg=STAGES[stageOf(proj)];
    const visible=tasks.filter(t=> cfg.prev? !!t[cfg.prev]:true);
    return {d:visible.filter(t=>!!t[cfg.doneKey]).length, n:visible.length};
  }
  async function getTask(id){
    if(mode==='preview') return previewData.tasks.find(t=>t.id===id);
    const { data } = await sb.from('tasks').select('*').eq('id',id).single(); return data;

  // ───── ACCOUNTING LEDGER ─────
  function normalizeDate(s){ const d=new Date(s); return isNaN(d)? s : d.toISOString().slice(0,10); }
  function parseDoc(text, fname, kind){
    const out={vendor:'',doc_date:'',descr:'',amount:''};
    const t=(text||'').replace(/ /g,' ');
    const lines=t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const flat=t.replace(/\s+/g,' ');
    const moneyRe=/([$£€]\s?\d{1,3}(?:,\d{3})*(?:\.\d{2})?|\d{1,3}(?:,\d{3})*\.\d{2})/g;
    const toNum=s=>{ const n=parseFloat(String(s).replace(/[^0-9.]/g,'')); return isNaN(n)?0:n; };

    // AMOUNT — always the total due (invoices) / total paid (receipts)
    const tiers = kind==='receipt'
      ? [/amount paid|total paid|paid in full/i, /grand total|total due|amount due|balance due/i, /\btotal\b/i]
      : [/total due|amount due|balance due|total payable|amount payable|invoice total/i, /grand total/i, /\btotal\b/i];
    let amount=0;
    for(const re of tiers){ lines.forEach(l=>{ if(re.test(l)) (l.match(moneyRe)||[]).forEach(m=>{ const n=toNum(m); if(n>amount)amount=n; }); }); if(amount) break; }
    if(!amount){ const m=flat.match(/(?:total due|amount due|balance due|total paid|amount paid|grand total|total)[^0-9$£€]{0,14}([$£€]?\s?\d[\d,]*\.\d{2})/i); if(m) amount=toNum(m[1]); }
    if(!amount){ (t.match(moneyRe)||[]).forEach(m=>{ const n=toNum(m); if(n>amount)amount=n; }); }
    out.amount = amount? amount.toFixed(2):'';

    // DATE
    const dm=t.match(/\b(\d{4}-\d{2}-\d{2}|\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4})\b/i);
    if(dm) out.doc_date=normalizeDate(dm[1]);

    // VENDOR — labelled "from/vendor/sold by", else a line with a company suffix, else top non-junk line
    const BAD=/invoice|receipt|^date|total|amount|bill to|ship to|sold to|\btax\b|qty|description|subtotal|balance|due|paid|\bpage\b|phone|tel\b|email|www\.|http|@|suite|p\.?o\.? box|\d{5}(?:-\d{4})?$/i;
    const SUFFIX=/\b(inc|llc|l\.l\.c|ltd|co|corp|corporation|company|studio|studios|group|services|agency|partners|associates|consulting|media|design|labs?|enterprises|solutions|systems)\b\.?/i;
    let vendor='';
    const lv=flat.match(/(?:bill from|sold by|remit to|pay to|vendor|supplier|from)\s*[:\-]\s*([A-Z0-9][^\n,]{2,50})/i);
    if(lv) vendor=lv[1].trim();
    if(!vendor){ const sl=lines.find(l=>SUFFIX.test(l) && !/bill to|ship to|sold to/i.test(l) && l.length<60); if(sl) vendor=sl.replace(/\s*[|–—-]\s.*$/,'').trim(); }
    if(!vendor){ const top=lines.slice(0,6).find(l=>/[A-Za-z]{3,}/.test(l) && !BAD.test(l)); if(top) vendor=top; }
    if(!vendor && fname) vendor=fname.replace(/\.[a-z0-9]+$/i,'').replace(/[_\-]+/g,' ').replace(/\b(invoice|receipt|inv|rcpt)\b/ig,'').replace(/\d{4}-\d{2}-\d{2}/,'').replace(/\s+/g,' ').trim();
    out.vendor=vendor.slice(0,60);

    // DESCRIPTION — labelled value (trimmed at next field), else first line item, else a sensible summary
    const STOP=/\b(subtotal|total|tax|amount|qty|quantity|unit price|bill to|ship to|date|invoice\s*#|due|balance)\b/i;
    let descr='';
    const ld=t.match(/(?:description|memo|notes?|service|item|for)\s*[:\-]\s*(.+)/i);
    if(ld){ descr=ld[1]; const s=descr.search(STOP); if(s>0) descr=descr.slice(0,s); }
    if(!descr){ const item=lines.find(l=>moneyRe.test(l) && !/total|subtotal|tax|balance|amount due|amount paid|paid/i.test(l)); if(item) descr=item.replace(moneyRe,'').replace(/\s{2,}/g,' ').trim(); }
    if(!descr && out.vendor) descr=(kind==='receipt'?'Payment to ':'Invoice from ')+out.vendor;
    out.descr=descr.replace(/[•|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,90);
    return out;
  }
  function fileToB64(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>res(''); r.readAsDataURL(file); }); }
  async function aiExtract(text, file, kind){
    if(!cfg.USE_AI) return null;
    const url = cfg.AI_ENDPOINT || 'extract.php';
    try{
      const body={ filename:file.name, kind, text };
      if((text||'').replace(/\s/g,'').length < 25){ body.imageBase64=await fileToB64(file); body.mime=file.type; }
      const r=await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      if(!r.ok) return null;
      const data=await r.json();
      if(!data || data.error) return null;
      return { vendor:data.vendor||'', doc_date:normalizeDate(data.date||data.doc_date||''), descr:data.description||data.descr||'', amount:(data.amount!=null&&data.amount!==''?String(data.amount).replace(/[^0-9.]/g,''):'') };
    }catch(e){ return null; }
  }
  async function extractFromFile(file, kind){
    let text='';
    const isPdf = /\.pdf$/i.test(file.name||'')||file.type==='application/pdf';
    if(isPdf){ try{ await ensurePdfjs(); }catch(e){} }
    try{
      if(isPdf && window.pdfjsLib){
        const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise;
        const pages=Math.min(pdf.numPages,3);
        for(let i=1;i<=pages;i++){
          const pg=await pdf.getPage(i); const c=await pg.getTextContent();
          const rows={};
          c.items.forEach(it=>{ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push([it.transform[4], it.str]); });
          Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{ const line=rows[y].sort((a,b)=>a[0]-b[0]).map(p=>p[1]).join(' ').replace(/\s+/g,' ').trim(); if(line) text+=line+'\n'; });
        }
      }
    }catch(e){}
    const ai=await aiExtract(text, file, kind); if(ai) return ai;
    return parseDoc(text, file.name, kind);
  }

  async function addLedgerDocs(proj, fileList){
    const files=[...fileList]; if(!files.length) return;
    const stream=streamOf(proj);
    // Baseline position once, not one DB round-trip per file.
    let base=0; try{ base=(await getStreamTasks(stream)).length; }catch(e){}
    // Debounced, focus-safe repaint so optimistic rows show up without stealing focus
    // from a field someone is editing (mirrors the realtime liveRender guard).
    let pending=null;
    const soon=()=>{ clearTimeout(pending); pending=setTimeout(function tick(){
      const el=document.activeElement;
      if(el && $('#view').contains(el) && /^(INPUT|TEXTAREA)$/.test(el.tagName)){ pending=setTimeout(tick,500); return; }
      renderLedger(proj);
    }, 120); };
    // Process every file concurrently: each row is created + shown immediately, then
    // uploaded and read in the background, so dropping N files reads them in parallel
    // instead of one-after-another — and the table never sits blank while reads run.
    await Promise.all(files.map(async (f,i)=>{
      let id;
      try{ id=await createTask({stream, title:f.name, position:base+i+1}); }
      catch(e){ return; }
      ledgerReading[id]=true; soon();            // row appears instantly, marked "Reading…"
      try{ await addFiles(id, [f]); }catch(e){}
      soon();                                     // thumbnail appears once uploaded
      let ex;
      try{ ex=await extractFromFile(f, proj.kind); }
      catch(e){ ex={vendor:'',doc_date:'',descr:'',amount:''}; }
      try{ await updateTask(id, {vendor:ex.vendor, doc_date:ex.doc_date, descr:ex.descr, amount:ex.amount}); }catch(e){}
      delete ledgerReading[id];
      logToSheet(f, ex, proj.kind);
      soon();                                     // fields fill in the moment the read returns
    }));
    clearTimeout(pending);
    renderLedger(proj);
  }

    const total=tasks.reduce((a,t)=>a+moneyNum(t.amount),0);

    const unpaid=total-paidTotal;
    let html='<div class="crumb"><a class="goDepts">Teams</a><span class="sep">›</span><a class="goProjects">'+esc(ctx.deptName||'')+'</a><span class="sep">›</span><span>'+esc(proj.name)+'</span></div>'+
      '<div class="page-head"><div><div class="kicker">'+(isInv?'Accounts payable':'Receipts')+'</div>'+

  async function renderStageBoard(proj){
    const cfg=STAGES[stageOf(proj)], st=stageOf(proj), stream=streamOf(proj);
    let tasks; try{ tasks=await getStreamTasks(stream); } catch(e){ $('#view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
    const visible=tasks.filter(t=> cfg.prev? !!t[cfg.prev]:true);
    const isRej=t=> st==='copy' && !!t.rejected && !t[cfg.doneKey];
    const active=visible.filter(t=> !t[cfg.doneKey] && !isRej(t)), completed=visible.filter(t=> !!t[cfg.doneKey]);
    const rejected=visible.filter(isRej);
    const canAdd=(st==='copy'||st==='board');
    let flow='';
    if(cfg.flow>=0){ const fl=cfg.flowArr||FLOW; flow='<div class="stage-flow">'+fl.map((f,i)=> (i?'<span class="ar">→</span>':'')+'<span class="'+(i===cfg.flow?'on':'')+'">'+esc(f)+'</span>').join('')+'</div>'; }
    let html='<div class="crumb"><a class="goDepts">Teams</a><span class="sep">›</span><a class="goProjects">'+esc(ctx.deptName||'')+'</a><span class="sep">›</span><span>'+esc(proj.name)+'</span></div>'+
      '<div class="page-head"><div><div class="kicker">'+esc(cfg.kicker)+'</div>'+
      '<h2>'+esc(proj.name)+'</h2>'+
      '<p class="sub">'+esc(cfg.sub)+'</p></div>'+
      (canAdd?'<button class="btn-accent" id="addTaskBtn">+ Add '+(st==='copy'?'Copy':'post')+'</button>':'')+'</div>'+
      flow+
      '<div class="bar"><div class="progress-text"><strong>'+completed.length+'</strong> of '+visible.length+' '+(cfg.button?'posted':'done')+'</div>'+
      '<div class="track"><div class="fill" style="width:'+(visible.length?completed.length/visible.length*100:0)+'%"></div></div></div>';
    if(active.length){
      const aHead = (st==='copy')
        ? '<th>#</th><th>Post</th><th class="fmt-h">Format</th><th>Added</th><th class="c">'+esc(cfg.action)+'</th><th class="c">Rejected</th>'
        : (st==='design')
        ? '<th>#</th><th>Post</th><th class="fmt-h">Format</th><th>Date</th><th>Asset</th><th class="c">'+esc(cfg.action)+'</th>'
        : '<th>#</th><th>Post</th><th class="fmt-h">Format</th><th class="c">'+esc(cfg.action)+'</th><th>Date</th><th>Asset</th>';
      html+='<div class="table-wrap"><table><thead><tr>'+aHead+'</tr></thead><tbody>';
      active.forEach((t,i)=>{

        const actCell = cfg.button

          : '<td class="status"'+(ready?'':' title="Add the date and the asset before marking complete"')+'><label class="check'+(ready?'':' locked')+'"><input type="checkbox" class="act" data-id="'+esc(t.id)+'"'+(ready?'':' disabled')+'><span class="box">'+checkSVG+'</span></label></td>';

          '<td class="fmt">'+esc(t.meta||'')+'</td>';

           : st==='design' ? (dateCell+assetInputCell+actCell)

          '</tr>';

      html+='</tbody></table></div>';
    } else if(!visible.length){
      html+='<div class="empty">'+(st==='copy'||st==='board'?'No posts yet. Add the first one to begin.':st==='design'?'Nothing to design yet. Approve copy in the Copy team to send posts here.':st==='post'?'Nothing ready yet. Approved copy from the Copy team lands here.':'Nothing ready yet. Finish designs in Graphic Design to send posts here.')+'</div>';

        : '<th>#</th><th>Post</th><th class="fmt-h">Format</th><th>Date</th><th>Asset</th><th></th>';
      html+='<div class="table-wrap done-wrap"><table><thead><tr>'+dHead+'</tr></thead><tbody>';
      completed.forEach(t=>{
        const baseCells='<td class="num open" data-open="'+esc(t.id)+'">'+String(t.position||'').padStart(2,'0')+'</td>'+
          '<td class="post open" data-open="'+esc(t.id)+'"><span class="post-link">'+esc(t.title)+'</span><span class="post-arrow">→</span></td>'+
          '<td class="fmt">'+esc(t.meta||'')+'</td>';

          '<td class="reopen-cell"><button class="reopen" data-id="'+esc(t.id)+'">Reopen</button></td></tr>';
      });
      html+='</tbody></table></div>';
    }
    if(rejected.length){
      html+='<div class="sec-title">Rejected <span class="sec-count">'+rejected.length+'</span></div>';
      html+='<div class="table-wrap done-wrap"><table><thead><tr><th>#</th><th>Post</th><th class="fmt-h">Format</th><th>Added</th><th></th></tr></thead><tbody>';
      rejected.forEach(t=>{
        html+='<tr class="done rejected-row" data-id="'+esc(t.id)+'"><td class="num open" data-open="'+esc(t.id)+'">'+String(t.position||'').padStart(2,'0')+'</td>'+
          '<td class="post open" data-open="'+esc(t.id)+'"><span class="post-link">'+esc(t.title)+'</span><span class="post-arrow">→</span></td>'+
          '<td class="fmt">'+esc(t.meta||'')+'</td>'+
          '<td class="date">'+(t.added?esc(t.added):'—')+'</td>'+
          '<td class="reopen-cell"><button class="unrej" data-id="'+esc(t.id)+'">Reopen</button></td></tr>';
      });
      html+='</tbody></table></div>';
    }
    html+='<footer>Journey.storage · Dallas, Texas'+(mode==='preview'?' · Preview mode: changes are not saved.':' · Updates save to the shared workspace in real time.')+'</footer>';
    $('#view').innerHTML=html;
    $('.goDepts').addEventListener('click', showDepartments);
    $('.goProjects').addEventListener('click', ()=>showProjects(ctx.deptId, ctx.deptName));
    const addBtn=$('#addTaskBtn'); if(addBtn) addBtn.addEventListener('click', ()=>openAddTask(proj));
    $('#view').querySelectorAll('td.open').forEach(td=> td.addEventListener('click', ()=> showPost(td.dataset.open)));
    async function markDone(id, val){
      const patch={updated_at:new Date().toISOString()}; patch[cfg.doneKey]=val;
      if(val){ const t=await getTask(id); if(t && !t[cfg.dateKey]) patch[cfg.dateKey]=new Date().toISOString().slice(0,10); }
      await updateTask(id,patch);
      if(st==='design' && val){ const t2=await getTask(id); if(t2) logDesignToSheet(t2); }
      renderStageBoard(proj);
    }
    $('#view').querySelectorAll('input.act').forEach(cb=> cb.addEventListener('change', e=>{
      if(st==='copy' && e.target.checked && !ensureApprover()){ e.target.checked=false; return; }
      markDone(e.target.dataset.id, e.target.checked);
    }));
    $('#view').querySelectorAll('button.act').forEach(b=> b.addEventListener('click', ()=> markDone(b.dataset.id, true)));
    $('#view').querySelectorAll('.reopen').forEach(b=> b.addEventListener('click', async ()=>{ const patch={}; patch[cfg.doneKey]=false; await updateTask(b.dataset.id,patch); renderStageBoard(proj); }));
    $('#view').querySelectorAll('button.rejbtn').forEach(b=> b.addEventListener('click', async ()=>{ if(!ensureApprover()) return; await updateTask(b.dataset.id,{rejected:true,updated_at:new Date().toISOString()}); renderStageBoard(proj); }));
    $('#view').querySelectorAll('button.unrej').forEach(b=> b.addEventListener('click', async ()=>{ await updateTask(b.dataset.id,{rejected:false}); renderStageBoard(proj); }));
    $('#view').querySelectorAll('input.dt').forEach(di=> di.addEventListener('change', async e=>{ const patch={}; patch[cfg.dateKey]=e.target.value||null; await updateTask(e.target.dataset.id,patch); if(st==='design') renderStageBoard(proj); }));
    $('#view').querySelectorAll('input.alink').forEach(inp=> inp.addEventListener('change', async e=>{ await updateTask(e.target.dataset.id,{asset_link:e.target.value.trim()||null}); if(st==='design') renderStageBoard(proj); }));
    $('#view').querySelectorAll('td.asset [data-drop]').forEach(el=> wireDrop(el, async fl=>{ await addFiles(el.dataset.drop, fl); renderStageBoard(proj); }));
  }

  // ───── MARKETING · unified content pipeline ─────
  // The three stage-teams (Copy → Graphic Design → Social) are the SAME task records at
  // different points in their flags. This view reads those tasks and places each in the
  // stage it is waiting on, so the whole pipeline is visible — and editable — in one place.
  const CONTENT_STAGES=['copy','design','social'];
  const MKT_ICON={
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5.2"></rect><circle cx="12" cy="12" r="3.8"></circle><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"></circle></svg>',
    li:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3zM9 9h3.83v1.64h.05c.53-1 1.84-2.06 3.79-2.06 4.05 0 4.8 2.67 4.8 6.14V21h-4v-5.44c0-1.3-.02-2.97-1.81-2.97-1.81 0-2.09 1.42-2.09 2.88V21H9z"></path></svg>'
  };
  const MKT_COLS=[
    {key:'content',name:'Content',step:'Step 1 · Copy',c:'#c9a24b'},
    {key:'design',name:'Graphic Design',step:'Step 2 · Design',c:'#8f8f8f'},
    {key:'social',name:'Social Media',step:'Step 3 · Publish',c:'var(--done)'}
  ];
  const MKT_NEXT={content:'Design',design:'Publish',social:'Live'};
  let mktChannel='all';
  function chanMeta(stream){
    const s=String(stream||'').toLowerCase();
    if(s==='ig'||/insta|(^|[^a-z])ig([^a-z]|$)/.test(s)) return {icon:MKT_ICON.ig,label:'Instagram'};
    if(/link|(^|[^a-z])li([^a-z]|$)/.test(s)) return {icon:MKT_ICON.li,label:'LinkedIn'};
    return {icon:'',label:String(stream||'—')};
  }
  function taskStage(t){ if(!t.copy_done) return 'content'; if(!t.design_done) return 'design'; if(!t.posted) return 'social'; return 'posted'; }
  function mktHasAsset(t){ return !!(String(t.asset_link||'').trim() || (t.assets&&t.assets.length)); }
  function mktBoardTasks(tasks){ return tasks.filter(t=> !(t.rejected && !t.copy_done)); }
  async function marketingData(){
    const projects=(await getProjects()).filter(p=>CONTENT_STAGES.includes(stageOf(p)));
    const streams=[...new Set(projects.map(p=>streamOf(p)).filter(Boolean))];
    const projByStageStream={}; projects.forEach(p=>{ projByStageStream[stageOf(p)+'|'+streamOf(p)]=p; });
    let tasks=[]; const seen={};
    for(const s of streams){ try{ const ts=await getStreamTasks(s); ts.forEach(t=>{ if(!seen[t.id]){ seen[t.id]=1; tasks.push(t); } }); }catch(e){} }
    return {projects,streams,projByStageStream,tasks};
  }
  async function showMarketing(){
    ctx={marketing:true};
    if(liveChannel){ sb.removeChannel(liveChannel); liveChannel=null; }
    setActiveNav();
    $('#view').innerHTML='<div class="loading">Loading marketing…</div>';
    let data; try{ data=await marketingData(); }catch(e){ $('#view').innerHTML='<div class="empty">Could not load marketing: '+esc(e.message)+'</div>'; return; }
    ctx.mkt=data; renderMarketing();
    if(mode==='auth'){
      let pending=null;
      const live=()=>{ clearTimeout(pending); pending=setTimeout(async function tick(){
        const el=document.activeElement; if(el && $('#view').contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)){ pending=setTimeout(tick,600); return; }
        try{ ctx.mkt=await marketingData(); }catch(e){} if(ctx.marketing) renderMarketing();
      },300); };
      liveChannel=sb.channel('mkt-tasks').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},live).subscribe();
    }
  }
  async function refreshMarketing(){ try{ ctx.mkt=await marketingData(); }catch(e){} renderMarketing(); }
  function mktPipe(stage){
    const idx={content:0,design:1,social:2,posted:3}[stage];
    let h='<div class="mkt-pipe">';
    for(let i=0;i<3;i++){ const cls=i<idx?'done':(i===idx?'active':''); h+='<span class="d '+cls+'"></span>'+(i<2?'<span class="ln '+(i<idx?'done':'')+'"></span>':''); }
    h+='<span class="nx">'+(stage==='posted'?'<b>Done</b>':'Next → <b>'+MKT_NEXT[stage]+'</b>')+'</span></div>';
    return h;
  }
  function mktStatus(t,stage){
    if(stage==='posted') return {cls:'muted',label:'Posted'+(t.posted_date?' · '+t.posted_date:'')};
    if(stage==='content') return {cls:'neutral',label:'Awaiting approval'};
    if(stage==='design'){ if(mktHasAsset(t)&&t.design_date) return {cls:'ready',label:'Ready to finish'}; return {cls:'warn',label: mktHasAsset(t)?'Needs date':'Needs asset'}; }
    return {cls:'ready',label:'Ready to post'};
  }
  function mktCard(t){
    const stage=taskStage(t), s=mktStatus(t,stage), cm=chanMeta(t.stream);
    const dateTxt = stage==='posted'? (t.posted_date||'')
      : stage==='social'? (t.design_date?'Designed '+t.design_date:'')
      : stage==='design'? (t.design_date?'Target '+t.design_date:'In design')
      : (t.added?'Added '+t.added:'');
    let action;
    if(stage==='content') action='<button class="mkt-act" data-act="approve" data-id="'+esc(t.id)+'">Approve</button>';
    else if(stage==='design'){ const ready=mktHasAsset(t)&&t.design_date; action= ready? '<button class="mkt-act" data-act="design" data-id="'+esc(t.id)+'">Mark done</button>' : '<button class="mkt-act ghost" data-act="open" data-id="'+esc(t.id)+'">Add asset →</button>'; }
    else if(stage==='social') action='<button class="mkt-act" data-act="post" data-id="'+esc(t.id)+'">Mark posted</button>';
    else action='<button class="mkt-act ghost" data-act="open" data-id="'+esc(t.id)+'">View</button>';
    return '<div class="mkt-card'+(stage==='posted'?' posted':'')+'">'+
      '<div class="top"><span class="mkt-chan">'+(cm.icon||'<span class="cd"></span>')+esc(cm.label)+'</span><span class="mkt-flagchip '+s.cls+'">'+esc(s.label)+'</span></div>'+
      '<h4 data-open="'+esc(t.id)+'">'+esc(t.title)+'</h4>'+
      '<div class="fmt">'+esc(t.meta||'')+(t.position?' · '+String(t.position).padStart(2,'0'):'')+'</div>'+
      mktPipe(stage)+
      '<div class="mkt-foot"><span class="mkt-date">'+esc(dateTxt)+'</span>'+action+'</div>'+
      '</div>';
  }
  function renderMarketing(){
    const data=ctx.mkt||{tasks:[],streams:[]};
    const all=mktBoardTasks(data.tasks||[]);
    const list = mktChannel==='all'? all : all.filter(t=> String(t.stream)===mktChannel);
    const byStage=s=> list.filter(t=> taskStage(t)===s);
    const content=byStage('content'), design=byStage('design'), social=byStage('social'), posted=byStage('posted');
    const designReady=design.filter(t=>mktHasAsset(t)&&t.design_date).length;
    const needAssets=design.length-designReady;
    const tiles=[
      {num:content.length,lab:'Drafting',note:'in Content'},
      {num:design.length,lab:'In design',note: needAssets? needAssets+' need assets':(design.length?'all have assets':'—'), warn:!!needAssets, flag:!!needAssets},
      {num:social.length,lab:'Ready to publish',note: social.length?'awaiting post':'—', ok:social.length>0},
      {num:posted.length,lab:'Published',note:'this cycle'}
    ];
    let sum='<div class="mkt-summary">'+tiles.map(t=>'<div class="mkt-stat'+(t.flag?' flag':'')+'"><div class="row1"><span class="num">'+t.num+'</span></div><div class="lab">'+t.lab+'</div><div class="note'+(t.warn?' warn':(t.ok?' ok':''))+'">'+esc(t.note)+'</div></div>').join('')+'</div>';
    let filt='<button class="mkt-fbtn'+(mktChannel==='all'?' on':'')+'" data-c="all">All</button>';
    (data.streams||[]).forEach(s=>{ const cm=chanMeta(s); filt+='<button class="mkt-fbtn'+(mktChannel===s?' on':'')+'" data-c="'+esc(s)+'">'+(cm.icon||'')+esc(cm.label)+'</button>'; });
    const cols=[content, design, social.concat(posted)];
    let board='<div class="mkt-board">';
    MKT_COLS.forEach((col,ci)=>{
      const items=cols[ci];
      board+='<section><div class="mkt-colhead" style="--wf:'+col.c+'"><span class="sw"></span><div><h3>'+col.name+'</h3><div class="step">'+col.step+'</div></div><span class="cnt">'+items.length+'</span></div><div class="mkt-colbody">';
      items.forEach(t=> board+=mktCard(t));
      if(col.key==='content') board+='<button class="mkt-add" id="mktAdd">+ New post</button>';
      else if(!items.length) board+='<div class="mkt-empty">Nothing here yet</div>';
      board+='</div></section>';
    });
    board+='</div>';
    const html='<div class="crumb"><a class="goDepts">Teams</a><span class="sep">›</span><span>Marketing</span></div>'+
      '<div class="page-head"><div><div class="kicker">Marketing · Production pipeline</div>'+
      '<h2>The <b>Marketing</b> board</h2>'+
      '<p class="sub">Content, design, and social in one team. Every post moves Content → Design → Social — see what it needs and what’s next.</p></div>'+
      '<button class="btn-accent" id="mktNew">+ New post</button></div>'+
      sum+
      '<div class="mkt-controls"><div class="lead"><b>'+list.length+'</b> post'+(list.length===1?'':'s')+' in the pipeline</div><div class="mkt-filters" id="mktFilters">'+filt+'</div></div>'+
      board+
      '<footer>Journey.storage · Dallas, Texas'+(mode==='preview'?' · Preview mode: changes are not saved.':' · Updates save to the shared workspace in real time.')+'</footer>';
    $('#view').innerHTML=html;
    $('.goDepts').addEventListener('click', showDepartments);
    $('#mktFilters').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; mktChannel=b.dataset.c; renderMarketing(); });
    const nb=$('#mktNew'); if(nb) nb.addEventListener('click', openMarketingAdd);
    const ab=$('#mktAdd'); if(ab) ab.addEventListener('click', openMarketingAdd);
    $('#view').querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=> openMarketingPost(el.dataset.open)));
    $('#view').querySelectorAll('.mkt-act').forEach(b=> b.addEventListener('click', ()=> mktAction(b.dataset.act, b.dataset.id)));
  }
  async function mktAction(act, id){
    const t=await getTask(id); if(!t) return;
    const today=new Date().toISOString().slice(0,10), now=new Date().toISOString();
    if(act==='open'){ openMarketingPost(id); return; }
    if(act==='approve'){ if(!ensureApprover()) return; await updateTask(id,{copy_done:true, copy_date:t.copy_date||today, updated_at:now}); }
    else if(act==='design'){ if(!(mktHasAsset(t)&&t.design_date)){ openMarketingPost(id); return; } await updateTask(id,{design_done:true, design_date:t.design_date||today, updated_at:now}); const t2=await getTask(id); if(t2) logDesignToSheet(t2); }
    else if(act==='post'){ await updateTask(id,{posted:true, posted_date:t.posted_date||today, updated_at:now}); }
    refreshMarketing();
  }
  async function openMarketingPost(id){
    const data=ctx.mkt||await marketingData();
    let t=(data.tasks||[]).find(x=>x.id===id); if(!t) t=await getTask(id); if(!t) return;
    const stage=taskStage(t), wantStage= stage==='content'?'copy':(stage==='posted'?'social':stage);
    const proj=(data.projByStageStream&&data.projByStageStream[wantStage+'|'+t.stream]) || {id:'mkt-'+t.stream, stage:wantStage, stream:t.stream, name:'Marketing'};
    if(liveChannel){ sb.removeChannel(liveChannel); liveChannel=null; }
    ctx.deptName='Marketing'; ctx.projectId=proj.id; ctx.projectName='Marketing board'; ctx.proj=proj; ctx.fromMarketing=true;
    showPost(id);
  }
  function openMarketingAdd(){
    const streams=(ctx.mkt&&ctx.mkt.streams&&ctx.mkt.streams.length)? ctx.mkt.streams : ['IG'];
    const opts=streams.map(s=>'<option value="'+esc(s)+'">'+esc(chanMeta(s).label)+'</option>').join('');
    mountModal('New post',
      '<div class="field"><label>Channel</label><select id="mStream" style="width:100%;font-family:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);background:#1a1917;border-radius:10px;padding:12px 14px;">'+opts+'</select></div>'+
      '<div class="field"><label>Post header</label><input id="tTitle" type="text" placeholder="The post title"></div>'+
      '<div class="field"><label>Format note</label><input id="tMeta" type="text" placeholder="e.g. Carousel · 5 slides"></div>'+
      '<div class="field"><label>The visual</label><textarea id="tVisual" placeholder="Visual direction"></textarea></div>'+
      '<div class="field"><label>The caption</label><textarea id="tBody" placeholder="Caption / body copy"></textarea></div>',
      async ()=>{ const title=$('#tTitle').value.trim(); if(!title) return; const stream=$('#mStream').value; const tasks=await getStreamTasks(stream); await createTask({stream,title,meta:$('#tMeta').value.trim(),visual:$('#tVisual').value.trim(),body:$('#tBody').value.trim(),position:tasks.length+1,added:new Date().toISOString().slice(0,10)}); closeModal(); refreshMarketing(); });
  }

  // ───── MODALS ─────
  function openNewDepartment(){
    mountModal('New team',
      '<div class="field"><label>Team name</label><input id="dName" type="text" placeholder="e.g. Video"></div>'+
      '<div class="field"><label>Description</label><textarea id="dDesc" placeholder="What does this team cover?"></textarea></div>',
      async ()=>{ const name=$('#dName').value.trim(); if(!name) return; await createDepartment({name,description:$('#dDesc').value.trim()}); closeModal(); showDepartments(); });
  }
  function openNewProject(deptId){
    mountModal('New project',
      '<div class="field"><label>Project name</label><input id="mName" type="text" placeholder="e.g. IG Content — August"></div>'+
      '<div class="field"><label>Short label</label><input id="mCover" type="text" placeholder="e.g. 12 posts"></div>'+
      '<div class="field"><label>Description</label><textarea id="mDesc" placeholder="What is this project?"></textarea></div>',
      async ()=>{ const name=$('#mName').value.trim(); if(!name) return; await createProject({name,department_id:deptId,cover:$('#mCover').value.trim(),description:$('#mDesc').value.trim()}); closeModal(); showProjects(deptId, ctx.deptName); });
  }
  function openAddTask(proj){
    const isCopy=stageOf(proj)==='copy';
    mountModal(isCopy?'Add copy':'Add post',
      '<div class="field"><label>'+(isCopy?'Copy header':'Post header')+'</label><input id="tTitle" type="text" placeholder="'+(isCopy?'The copy title':'The post title')+'"></div>'+
      '<div class="field"><label>Format note</label><input id="tMeta" type="text" placeholder="e.g. Carousel · 5 slides"></div>'+
      '<div class="field"><label>The visual</label><textarea id="tVisual" placeholder="Visual direction"></textarea></div>'+
      '<div class="field"><label>The caption</label><textarea id="tBody" placeholder="Caption / body copy"></textarea></div>',
      async ()=>{ const title=$('#tTitle').value.trim(); if(!title) return; const tasks=await getStreamTasks(streamOf(proj)); await createTask({stream:streamOf(proj),title,meta:$('#tMeta').value.trim(),visual:$('#tVisual').value.trim(),body:$('#tBody').value.trim(),position:tasks.length+1,added:new Date().toISOString().slice(0,10)}); closeModal(); renderStageBoard(proj); });
  }
  function mountModal(heading, bodyHtml, onSave){
    $('#modalMount').innerHTML='<div class="overlay"><div class="modal"><h3>'+heading+'</h3>'+bodyHtml+
      '<div class="btn-row"><button class="btn-accent" id="mSave">Save</button><button class="btn-pill" id="mCancel" style="background:transparent;border:1px solid var(--line);color:var(--ink-soft)">Cancel</button></div></div></div>';
    $('#mSave').addEventListener('click', async ()=>{ await onSave(); });
    $('#mCancel').addEventListener('click', closeModal);
  }
  function closeModal(){ $('#modalMount').innerHTML=''; }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
})();
</script>
</body>
</html>
