<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Journey.storage — Accounting Intake</title>
<style>
  html,body{margin:0;height:100%;background:#181818;color:#f5f0e8;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  .card{max-width:420px;}
  h1{font-size:18px;font-weight:600;margin:0 0 8px;}
  p{color:#888680;margin:0 0 14px;font-size:14px;}
  a{color:#ff6320;font-weight:600;text-decoration:none;border-bottom:1px solid rgba(255,99,32,.4);}
  a:hover,a:focus-visible{border-bottom-color:#ff6320;outline:none;}
  .spinner{width:22px;height:22px;border:2px solid #34312d;border-top-color:#ff6320;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none;}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="spinner"></div>
  <h1>Opening the Accounting portal…</h1>
  <p>The invoice &amp; receipt portal now runs inside Google Workspace. Sign in with your <strong>@journey.storage</strong> account if asked.</p>
  <p id="manual" hidden>Not redirected? <a id="link" href="#">Open the portal</a></p>
</div></div>
<!-- config.js (gitignored; written from a repo secret on deploy) holds the
     Apps Script Web App URL. The page itself is served by that script now —
     see apps-script/Code.gs (doGet) and GOOGLE-SHEETS-SETUP.md. -->
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(function(){
  var cfg = window.JOURNEY_CONFIG || {};
  var url = cfg.SHEETS_WEBAPP_URL;
  var ok = url && url.indexOf('PASTE_') === -1;
  var manual = document.getElementById('manual'), link = document.getElementById('link');
  if(!ok){ manual.hidden = false; link.textContent = 'Portal URL is not configured'; link.removeAttribute('href'); return; }
  link.href = url;
  setTimeout(function(){ manual.hidden = false; }, 2500);
  window.location.replace(url);
})();
</script>
</body>
</html>
